<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Editar Usuário - PowerFit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
    h1 { text-align: center; color: #333; }
    form { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }
    label { display: block; margin-top: 10px; }
    input, select { width: 100%; padding: 8px; margin-top: 5px; }
    button { margin-top: 15px; padding: 10px; background-color: #333; color: #fff; border: none; cursor: pointer; }
    button:hover { background-color: #555; }
  </style>
</head>
<body>
  <h1>Editar Usuário</h1>
  <form id="editForm">
    <label>Nome:</label>
    <input type="text" id="nome" required>
    <label>Email:</label>
    <input type="email" id="email" required>
    <label>Senha:</label>
    <input type="password" id="senha" required>
    <label>Data Nasc.:</label>
    <input type="date" id="dataNasc" required>
    <label>Telefone:</label>
    <input type="text" id="telefone" required>
    <label>CEP:</label>
    <input type="text" id="cep">
    <label>Rua:</label>
    <input type="text" id="rua">
    <label>Número:</label>
    <input type="text" id="numero">
    <label>Complemento:</label>
    <input type="text" id="compl">
    <label>Bairro:</label>
    <input type="text" id="bairro">
    <label>Cidade:</label>
    <input type="text" id="cidade">
    <label>Estado:</label>
    <input type="text" id="estado">
    <label>Função:</label>
    <select id="funcao">
      <option value="cliente">Aluno</option>
      <option value="instrutor">Instrutor</option>
      <option value="administrador">Administrador</option>
    </select>
    <label>Plano:</label>
    <input type="text" id="plano">
    <label>Tempo:</label>
    <input type="text" id="tempo">
    <button type="submit">Salvar Alterações</button>
  </form>

  <script>
    const API = "http://localhost:8081";
    const params = new URLSearchParams(window.location.search);
    const cpf = params.get("cpf");

    // Carregar dados do usuário
    async function carregarUsuario() {
      try {
        const response = await fetch(`${API}/cadastros/${cpf}`);
        if (!response.ok) {
          alert("Usuário não encontrado. Verifique se o CPF existe no banco.");
          return;
        }
        const user = await response.json();

        document.getElementById("nome").value = user.nome || "";
        document.getElementById("email").value = user.email || "";
        document.getElementById("senha").value = user.senha || "";
        document.getElementById("dataNasc").value = user.dataNasc || "";
        document.getElementById("telefone").value = user.telefone || "";
        document.getElementById("cep").value = user.cep || "";
        document.getElementById("rua").value = user.rua || "";
        document.getElementById("numero").value = user.numero || "";
        document.getElementById("compl").value = user.compl || "";
        document.getElementById("bairro").value = user.bairro || "";
        document.getElementById("cidade").value = user.cidade || "";
        document.getElementById("estado").value = user.estado || "";
        document.getElementById("funcao").value = user.funcao || "cliente";
        document.getElementById("plano").value = user.plano || "";
        document.getElementById("tempo").value = user.tempo || "";
      } catch (erro) {
        console.error(erro);
        alert("Erro ao carregar usuário.");
      }
    }

    // Atualizar dados do usuário
    document.getElementById("editForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const dados = {
        nome: document.getElementById("nome").value,
        email: document.getElementById("email").value,
        senha: document.getElementById("senha").value,
        dataNasc: document.getElementById("dataNasc").value,
        telefone: document.getElementById("telefone").value,
        cep: document.getElementById("cep").value,
        rua: document.getElementById("rua").value,
        numero: document.getElementById("numero").value,
        compl: document.getElementById("compl").value,
        bairro: document.getElementById("bairro").value,
        cidade: document.getElementById("cidade").value,
        estado: document.getElementById("estado").value,
        funcao: document.getElementById("funcao").value,
        plano: document.getElementById("plano").value,
        tempo: document.getElementById("tempo").value
      };

      try {
        const response = await fetch(`${API}/cadastros/atualizar/${cpf}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dados)
        });
        if (response.ok) {
          alert("Usuário atualizado com sucesso!");
          window.location.href = "usuarios.html";
        } else {
          alert("Erro ao atualizar usuário.");
        }
      } catch (erro) {
        console.error(erro);
        alert("Erro ao atualizar usuário.");
      }
    });

    carregarUsuario();
  </script>
</body>
</html>
