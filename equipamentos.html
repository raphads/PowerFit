<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit">
  <title>PowerFit</title>
  <link rel="icon" href="images/logo_semnome.png">
  <link rel="stylesheet" href="site_academia.css">
  <script src="site_academia.js"></script>
</head>
<body>
  <header>
    <div class="menu-icon" onclick="toggleMenu()">&#9776;</div>
    <img src="images/logo_semnome.png" height="10%" width="10%">
    <h1>PowerFit</h1>
  </header>

  <nav class="sidebar" id="sidebar">
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="cadastro.html">Cadastro</a></li>
      <li><a href="agendamento.html">Agendamento</a></li>
      <li><a href="equipamentos.html">Equipamentos</a></li>
      <li><a href="planos.html">Planos</a></li>
      <li><a href="pagamentos.html">Pagamentos</a></li>
      <li><a href="aulas.html">Aulas</a></li>
      <li><a href="relatorios.html">Relatórios</a></li>
    </ul>
  </nav>

  <section class="content">
    <h2>Cadastro de Equipamentos</h2>
    <form id="equipForm">
      <label for="codigo">Código:</label>
      <input type="number" id="codigo" required placeholder="1111"><br>

      <label for="tipo">Tipo:</label>
      <input type="text" id="tipo" required><br>

      <label for="marca">Marca:</label>
      <input type="text" id="marca" required><br>

      <label for="data_compra">Data de Compra:</label>
      <input type="date" id="data_compra" required><br>

      <label for="data_manut">Data de Manutenção:</label>
      <input type="date" id="data_manut" required><br>

      <label for="modalidade">Status:</label>
      <select id="modalidade">
        <option value="Disponível">Disponível</option>
        <option value="Em Manutenção">Em Manutenção</option>
        <option value="Substituído">Substituído</option>
      </select><br>

      <button type="submit">Cadastrar</button>
    </form>
  </section>

  <footer>
    <p>
      <a href="https://facebook.com/"><img src="images/facebook.png" height="20" width="20"></a>
      <a href="https://instagram.com/"><img src="images/instagram - Copia.png" height="20" width="20"></a>
      <a href="https://twitter.com/"><img src="images/twitter.png" height="20" width="20"></a>
      <a href="https://tiktok.com/"><img src="images/tik-tok.png" height="20" width="20"></a>
      <a href="https://youtube.com/"><img src="images/youtube.png" height="20" width="20"></a>
    </p>
    <p>Telefone: (99) 99999-9999</p>
  </footer>

  <script>
    const API = "http://localhost:8081";

    document.getElementById("equipForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const dados = {
        codigo: document.getElementById("codigo").value,
        tipo: document.getElementById("tipo").value,
        marca: document.getElementById("marca").value,
        data_compra: document.getElementById("data_compra").value,
        data_manut: document.getElementById("data_manut").value,
        modalidade: document.getElementById("modalidade").value
      };

      try {
        const response = await fetch(API + "/equipamentos/novo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(dados)
        });

        if (response.ok) {
          alert("Equipamento cadastrado com sucesso!");
          document.getElementById("equipForm").reset();
        } else {
          alert("Erro ao cadastrar equipamento.");
        }
      } catch (erro) {
        console.error(erro);
        alert("Erro de comunicação com o servidor.");
      }
    });
  </script>
</body>
</html>
